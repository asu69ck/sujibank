<title>酥雞銀行</title>
<style>
:root{
  --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F4F3EF; --ink:#1F2024; --ink-2:#6E7077; --ink-3:#A8AAB1; --line:#ECEBE6;
  --yellow:#F8DC6E; --blue:#A8CFF4; --blue-ink:#3C7DC0; --coral:#F07F55; --on:#1F2024; --pale:rgba(255,255,255,.62);
  --num:"Nunito",ui-rounded,"SF Pro Rounded",-apple-system,sans-serif;
  --sans:"Huninn",ui-rounded,"SF Pro Rounded","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1F2024; --surface:#2A2B31; --surface-2:#2F3036; --ink:#F4F2EC; --ink-2:#A7A9B0; --ink-3:#6D6F77; --line:#36383F;
    --yellow:#F1D466; --blue:#93BDE8; --blue-ink:#A8CFF4; --coral:#EE8B66; --pale:rgba(255,255,255,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1F2024; --surface:#2A2B31; --surface-2:#2F3036; --ink:#F4F2EC; --ink-2:#A7A9B0; --ink-3:#6D6F77; --line:#36383F;
  --yellow:#F1D466; --blue:#93BDE8; --blue-ink:#A8CFF4; --coral:#EE8B66; --pale:rgba(255,255,255,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-synthesis:none}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue-ink);outline-offset:2px;border-radius:6px}
.wrap{max-width:540px;margin:0 auto;padding:0 20px calc(104px + env(safe-area-inset-bottom,0px))}
.n{font-family:var(--num)}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);margin:0 -20px;padding:12px 20px 10px}
.titlerow{display:flex;align-items:flex-end;gap:8px;min-height:48px}
h1{font-size:30px;font-weight:800;margin:0;line-height:1.1;letter-spacing:.02em}
h1 .n{font-family:var(--num);font-size:38px;font-weight:900;letter-spacing:-.02em;margin-right:2px}
.yr{color:var(--ink-3);font-family:var(--num);font-weight:600;font-size:15px;padding-bottom:4px}
.nav{margin-left:auto;display:flex;gap:2px;align-self:center}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:21px;height:21px}

/* summary: the yellow block with a blue block peeking out behind it */
.sum{position:relative;margin:8px 0 22px;padding:20px 22px 18px;background:var(--yellow);color:var(--on);border-radius:28px;overflow:hidden}
.sum.alt{background:var(--blue)}
.sum-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:0 16px}
.sum-side{text-align:right;padding-top:1px}
.sum-side .sum-label{opacity:.7}
.sum-side-v{margin:4px 0 0;font-family:var(--num);font-size:24px;font-weight:900;line-height:1.2}
.sum-side-v .yen{font-size:15px;margin-right:1px}
.sum-label{position:relative;margin:0;font-size:13px;font-weight:800;letter-spacing:.06em}
.sum-big{position:relative;margin:4px 0 12px;font-family:var(--num);font-size:46px;font-weight:900;letter-spacing:-.02em;line-height:1.05}
.sum-big .yen{font-size:24px;font-weight:600;margin-right:2px}
.metas{position:relative;display:flex;flex-wrap:wrap;gap:8px;font-size:13px;font-weight:700}
.metas > *{background:rgba(255,255,255,.72);color:var(--on);padding:5px 12px;border-radius:14px}
.metas b{font-family:var(--num);font-weight:700;margin-left:5px}
.metas .due-m{background:var(--coral);color:#fff}
.sum-sub{position:relative;margin:0;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;font-weight:700;opacity:.72}
.sum-sub b{font-family:var(--num);font-weight:800;margin-left:5px}
.muted{color:var(--ink-2);font-size:13px;margin:0}
/* yellow card: total on the left, concert box on the right */
.sum.has-gig{display:grid;grid-template-columns:minmax(0,1fr) 118px;gap:12px;align-items:stretch}
.sum.has-gig .sum-big{font-size:min(44px,10.5vw)}
.sum.has-gig .sum-sub{flex-direction:column;gap:2px}
.gig{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;padding:12px 12px 11px;border-radius:20px;background:rgba(255,255,255,.8);color:var(--on);text-align:left}
.gig-l{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:800;opacity:.6}
.gig-l svg{width:13px;height:13px}
.gig-n{font-size:14px;font-weight:800;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.gig-d{font-family:var(--num);font-size:12px;font-weight:700;opacity:.65}
.gig-c{margin-top:auto;padding-top:6px;font-size:12px;font-weight:800}
.gig-c b{font-family:var(--num);font-size:24px;font-weight:900;margin-right:3px}
.gig-more{font-size:11px;font-weight:700;opacity:.55}
.side-box{display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;padding:12px;border-radius:20px;background:rgba(255,255,255,.8);color:var(--on)}
.side-v{font-family:var(--num);font-size:34px;font-weight:900;line-height:1.1}
.side-v small{font-size:18px;margin-left:1px}
/* stats */
.view-seg{margin:0 0 16px}
.pie{position:relative;width:236px;max-width:70%;margin:6px auto 16px}
.pie svg{display:block;width:100%;height:auto}
.pie-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.pie-c b{font-family:var(--num);font-size:22px;font-weight:900}
.dot{flex:none;width:16px;height:16px;border-radius:50%;margin:0 12px 0 4px}

.sec{font-size:15px;font-weight:800;color:var(--ink);margin:28px 0 10px}
.sec-row{display:flex;align-items:baseline;justify-content:space-between}
.sec-row .sec + .sec{font-family:var(--num);font-weight:700;color:var(--ink-2)}
.link{color:var(--blue-ink);font-size:14px;font-weight:700;padding:6px 0}

/* days */
.day{padding-top:16px;scroll-margin-top:calc(80px + env(safe-area-inset-top,0px))}
.day-h{display:flex;align-items:center;gap:8px;padding-bottom:4px}
.day-n{font-family:var(--num);font-size:26px;font-weight:900;line-height:1;min-width:30px}
.day-w{font-size:13px;color:var(--ink-2);font-weight:600}
.day-w b{margin-left:6px;background:var(--blue);color:var(--on);font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px}
.day-sum{margin-left:auto;color:var(--ink-2);font-family:var(--num);font-weight:600;font-size:15px}
.day-add{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3)}
.day-add svg{width:17px;height:17px}
.later{margin-top:30px;display:flex;justify-content:space-between;align-items:baseline}
.later .sec{margin:0}
.card{background:transparent}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;min-height:58px;border-bottom:1px solid var(--line)}
.row:active{opacity:.6}
.ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:800;color:var(--on);background:var(--yellow)}
.ic.t-fun{background:var(--blue)}
.ic.t-inc{background:var(--surface-2);color:var(--ink)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-t{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s .evtag{color:var(--blue-ink);font-weight:700}
.row-a{font-family:var(--num);font-size:17px;font-weight:800;white-space:nowrap;text-align:right}
.row-a small{display:block;font-size:11px;font-weight:600;color:var(--ink-2)}
.row-a.inc{color:var(--blue-ink)}
.row-pct{font-size:11px;font-weight:600;color:var(--ink-3);display:block}

/* small corner tag, like the label on a book cover */
.tag{flex:none;font-size:11px;font-weight:800;padding:3px 9px;border-radius:10px;line-height:1.2;white-space:nowrap}
.tag.due{background:var(--coral);color:#fff}
.tag.part{background:linear-gradient(90deg,var(--blue) 50%,var(--coral) 50%);color:var(--on)}

.empty{text-align:center;padding:40px 16px;color:var(--ink-2)}
.empty p{margin:0 0 16px}
.blank{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px;border:2px dashed var(--line);border-radius:20px;color:var(--ink-3);font-size:14px;margin-top:4px}
.blank span:last-child{color:var(--ink);font-weight:800;background:var(--yellow);padding:4px 12px;border-radius:14px;color:var(--on)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 26px;border-radius:24px;background:var(--yellow);color:var(--on);font-size:16px;font-weight:800}
.btn:active{transform:scale(.97)}
.btn.wide{width:100%;margin-top:22px}
.btn.danger{background:transparent;color:var(--coral);box-shadow:none;border:1.5px solid currentColor}

/* segmented */
.seg{display:flex;background:var(--surface-2);border-radius:22px;padding:3px;gap:2px}
.seg button{flex:1;height:34px;border-radius:18px;font-size:14px;font-weight:700;color:var(--ink-2);text-align:center;padding:0 12px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--yellow);color:var(--on)}

/* fun */
.stack{position:relative;display:flex;height:10px;overflow:hidden;gap:3px;margin:14px 0 2px;border-radius:5px}
.stack i{display:block;min-width:4px;background:var(--surface);border-radius:5px}
.stack i:nth-child(4n+2){background:var(--on);opacity:.75}
.stack i:nth-child(4n+3){background:var(--yellow)}
.stack i:nth-child(4n){background:rgba(255,255,255,.45)}
.budget{position:relative;margin:12px 0 2px}
.budget-track{height:8px;background:rgba(255,255,255,.6);border-radius:3px;overflow:hidden}
.budget-fill{height:100%;background:var(--on)}
.budget-fill.over{background:var(--coral)}
.budget-txt{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-top:6px}

/* event tickets: colour block with the other colour offset behind */
.tickets{display:flex;flex-direction:column;gap:16px}
/* concert ticket: main part + tear-off stub, notched at the perforation */
.ticket{--stub:92px;--notch:11px;position:relative;display:flex;width:100%;border-radius:20px;background:var(--tk,var(--yellow));color:var(--tk-ink,var(--on));text-align:left;
  -webkit-mask:radial-gradient(circle var(--notch) at calc(100% - var(--stub)) 0,#0000 96%,#000) top/100% 51% no-repeat,radial-gradient(circle var(--notch) at calc(100% - var(--stub)) 100%,#0000 96%,#000) bottom/100% 51% no-repeat;
          mask:radial-gradient(circle var(--notch) at calc(100% - var(--stub)) 0,#0000 96%,#000) top/100% 51% no-repeat,radial-gradient(circle var(--notch) at calc(100% - var(--stub)) 100%,#0000 96%,#000) bottom/100% 51% no-repeat}
.ticket .tk-parts span{color:#1F2024}
.ticket.used{opacity:.88}
.tk-main{position:relative;flex:1;min-width:0;padding:15px 14px 16px 20px;display:flex;flex-direction:column}
.tk-head{display:flex;align-items:center;gap:8px;font-family:var(--num);font-size:12px;font-weight:800}
.tk-no{opacity:.55;letter-spacing:.08em}
.tk-kind{background:var(--tk-ink,var(--on));color:var(--tk,#fff);font-family:var(--sans);font-size:10px;padding:2px 8px;border-radius:8px;letter-spacing:.1em}
.tk-name{font-size:19px;font-weight:800;line-height:1.3;margin-top:6px;padding-right:58px}
.tk-total{font-family:var(--num);font-size:30px;font-weight:900;margin-top:4px;letter-spacing:-.01em}
.tk-total .yen{font-size:17px;margin-right:2px}
.tk-parts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12px;font-weight:700}
.tk-parts span{background:rgba(255,255,255,.72);padding:4px 10px;border-radius:12px}
.tk-parts b{font-family:var(--num);margin-left:4px}
.tk-due{margin-top:8px;align-self:flex-start}
.tk-stub{flex:none;width:var(--stub);border-left:2px dashed color-mix(in srgb,var(--tk-ink,#1F2024) 30%,transparent);background:rgba(255,255,255,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 6px;text-align:center}
.tk-m{font-size:12px;font-weight:800}
.tk-d{font-family:var(--num);font-size:36px;font-weight:900;line-height:1.05}
.tk-w{font-size:11px;font-weight:700;opacity:.7}
.tk-to{font-family:var(--num);font-size:11px;font-weight:800;opacity:.7;margin-top:2px}
.tk-code{margin-top:10px;width:58px;height:24px;border-radius:2px;opacity:.8;background:repeating-linear-gradient(90deg,var(--tk-ink,#1F2024) 0 2px,transparent 2px 4px,var(--tk-ink,#1F2024) 4px 5px,transparent 5px 7px,var(--tk-ink,#1F2024) 7px 10px,transparent 10px 11px,var(--tk-ink,#1F2024) 11px 12px,transparent 12px 15px)}
.tk-used{position:absolute;right:12px;top:12px;border:2px solid var(--coral);color:var(--coral);border-radius:10px;padding:2px 8px;font-size:12px;font-weight:900;transform:rotate(-10deg);letter-spacing:.1em;background:rgba(255,255,255,.35)}
.ticket.static{cursor:default;margin:6px 0 18px;width:auto}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{position:relative;width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink)}
.sw-custom{background:conic-gradient(#F8DC6E,#F5B49A,#F7C3D6,#C9B6F2,#A8CFF4,#B9E3C6,#F8DC6E);overflow:hidden;cursor:pointer}
.sw-custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.tk-color{margin:-4px 0 6px}

/* stats */
.bars{display:flex;align-items:flex-end;gap:6px;height:170px;padding:20px 2px 0}
.bars button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.bars .b{width:100%;max-width:20px;border-radius:10px;background:var(--blue);min-height:3px}
.bars button[aria-pressed="true"] .b{background:var(--yellow);}
.bars .bl{font-family:var(--num);font-size:12px;font-weight:600;color:var(--ink-3)}
.bars button[aria-pressed="true"] .bl{color:var(--ink);font-weight:800}
.hbar{height:5px;background:var(--surface-2);margin-top:6px;overflow:hidden;border-radius:3px}
.hbar i{display:block;height:100%;background:var(--yellow)}
.hbar.t-fun i{background:var(--blue)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.kpi{padding:14px 16px;border-radius:22px;background:var(--surface-2)}
.kpi p{margin:0}
.kpi .v{font-family:var(--num);font-size:24px;font-weight:900}

/* settings */
.set{background:var(--surface-2);border-radius:22px;overflow:hidden}
.set-row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 16px;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .grow{flex:1}
.set-row .val{color:var(--ink-2);font-family:var(--num);font-weight:600}
.set-row.act{color:var(--blue-ink);font-weight:700}
.set-row.red{color:var(--coral);font-weight:700}
.set-pad{padding:14px 16px}
.hint{font-size:13px;color:var(--ink-2);margin:8px 2px 0;line-height:1.6}
.numin{width:120px;text-align:right;border:0;background:var(--surface);border-radius:14px;height:36px;padding:0 12px;font-family:var(--num);font-weight:700;font-size:16px}
.txtin{width:100%;border:0;background:var(--surface-2);border-radius:18px;height:46px;padding:0 12px;font-size:16px}
.set .txtin{background:var(--surface)}
.steps{margin:0;padding-left:20px;color:var(--ink-2);font-size:14px}
.steps li{margin:4px 0}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:34px;padding:0 14px;border-radius:17px;background:var(--surface-2);font-size:14px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.set .chip{background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--yellow);color:var(--on)}
.chip.dashed{background:transparent;border:1.5px dashed var(--ink-3)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:60px;align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;color:var(--ink-3);height:100%;justify-content:center;position:relative}
.tab svg{width:24px;height:24px;position:relative}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--on)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:7px;left:calc(50% - 22px);width:44px;height:28px;border-radius:14px;background:var(--yellow)}
.fab{justify-self:center;width:54px;height:54px;border-radius:50%;background:var(--yellow);color:var(--on);display:grid;place-items:center;font-size:21px;font-weight:900;transform:translateY(-10px);box-shadow:0 0 0 5px var(--paper),0 6px 18px rgba(240,190,40,.35)}
.fab:active{transform:translateY(-10px) scale(.94)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:40}
#sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(20,22,28,.4);opacity:0;transition:opacity .22s}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:540px;margin:0 auto;max-height:calc(100% - env(safe-area-inset-top,0px) - 12px);background:var(--paper);border-radius:30px 30px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.open .scrim{opacity:1}
#sheet.open .panel{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 16px;flex:none;gap:8px}
.sheet-head h3{margin:0;font-size:17px;font-weight:800;text-align:center}
.sheet-head .l{justify-self:start;color:var(--ink-2);font-weight:600;padding:8px 4px}
.sheet-head .r{justify-self:end;color:var(--blue-ink);font-weight:700;padding:8px 4px}
.sheet-head .r.red{color:var(--coral)}
.sheet-body{isolation:isolate;overflow-y:auto;padding:4px 20px 18px;flex:1;-webkit-overflow-scrolling:touch}

/* add sheet */
.amt{position:relative;display:flex;flex-direction:column;align-items:flex-end;padding:10px 16px 10px;margin:4px 0 16px;min-height:88px;justify-content:flex-end;background:var(--yellow);color:var(--on);border-radius:26px}
.amt.inc{background:var(--blue)}
.amt-expr{font-family:var(--num);font-size:14px;font-weight:600;min-height:20px;opacity:.7}
.amt-v{font-family:var(--num);font-size:42px;font-weight:900;line-height:1.1;letter-spacing:-.02em}
.amt-v .yen{font-size:22px;margin-right:2px}
.amt-v.zero{opacity:.35}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.note{width:100%;height:46px;border:0;border-radius:23px;padding-left:18px;background:var(--surface-2);padding:0 14px;font-size:16px}
.note::placeholder{color:var(--ink-3)}
.sug{display:flex;gap:6px;overflow-x:auto;margin:10px -20px 0;padding:0 20px;scrollbar-width:none}
.sug::-webkit-scrollbar{display:none}
.sug .chip{height:30px;font-size:13px}
.field-l{font-size:13px;font-weight:800;color:var(--ink);margin:18px 0 8px}
.date-pick{position:relative}
.date-pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.pay .seg{max-width:300px}
.split{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;font-weight:700}
.split label{display:flex;align-items:center;gap:8px}
.split input{width:110px;height:38px;border:0;border-radius:19px;background:var(--surface-2);padding:0 10px;text-align:right;font-family:var(--num);font-weight:700;font-size:17px}
.split .rest{margin-left:auto;display:flex;align-items:center;gap:8px}
.split .rest b{font-family:var(--num);font-size:17px}
.cats{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:66px;gap:6px;overflow-x:auto;margin:0 -20px;padding:2px 20px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;border-radius:10px;font-size:12px;font-weight:600;color:var(--ink-2)}
.cat .ic{width:46px;height:46px;font-size:19px;border-radius:50%}
.cat[aria-pressed="true"]{color:var(--ink);font-weight:800}
.cat[aria-pressed="true"] .ic{box-shadow:0 0 0 3px var(--paper),0 0 0 5.5px var(--ink)}
.keypad{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px 12px;background:var(--surface-2)}
.key{height:50px;border-radius:25px;background:var(--surface);font-family:var(--num);font-size:23px;font-weight:800;display:grid;place-items:center}
.key:active{background:var(--line)}
.key.op{color:var(--blue-ink);font-size:26px}
.key.save{background:var(--yellow);color:var(--on);font-family:var(--sans);font-size:17px;font-weight:800}
.key svg{width:24px;height:24px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;z-index:60;background:var(--on);color:#fff;border-radius:22px;padding:12px 18px;font-size:14px;font-weight:700;display:flex;gap:16px;align-items:center;transition:.22s;pointer-events:none;max-width:calc(100% - 40px)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--yellow);flex:none;white-space:nowrap;font-weight:800}

.search{display:flex;gap:8px;align-items:center}
.found{display:flex;justify-content:space-between;margin:14px 0 4px;color:var(--ink-2);font-size:13px;font-weight:700}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* 記帳畫面的類別：精簡成小膠囊 */
#ad-cats{grid-auto-columns:max-content;gap:6px}
#ad-cats .cat{flex-direction:row;gap:6px;height:36px;padding:0 12px 0 4px;border-radius:18px;background:var(--surface-2);font-size:14px;font-weight:700;white-space:nowrap}
#ad-cats .cat .ic{width:28px;height:28px;font-size:13px}
#ad-cats .cat[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink);font-weight:800}
#ad-cats .cat[aria-pressed="true"] .ic{box-shadow:none}

/* 往左滑刪除 */
.swipe{position:relative;overflow:hidden}
.swipe-del{position:absolute;top:0;right:0;bottom:1px;width:88px;background:var(--coral);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;visibility:hidden}
.swipe.show-del .swipe-del{visibility:visible}
.swipe .row{position:relative;background:var(--paper);transition:transform .22s ease;touch-action:pan-y}
.swipe .row.drag{transition:none}
.swipe .row:active{opacity:1}
.swipe .row:active > *{opacity:.6}
.swipe.gone{transition:max-height .22s ease,opacity .22s ease;max-height:0 !important;opacity:0}
</style>
</head>
<body>
<div class="wrap"><main id="view"></main></div>

<nav class="tabbar" aria-label="主要分頁">
  <div class="tabbar-in">
    <button class="tab" data-tab="list" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="4.5" y="3.5" width="15" height="17" rx="1.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>明細</button>
    <button class="tab" data-tab="fun">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3.5 7a1.5 1.5 0 0 1 1.5-1.5h14A1.5 1.5 0 0 1 20.5 7v2.4a2.6 2.6 0 0 0 0 5.2V17a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 17v-2.4a2.6 2.6 0 0 0 0-5.2Z"/><path d="M15 7v1.5M15 11.3v1.4M15 15.5V17" stroke-linecap="round"/></svg>娛樂</button>
    <button class="fab" data-act="add" aria-label="記一筆">記</button>
    <button class="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-5M3 20.5h18"/></svg>統計</button>
    <button class="tab" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>設定</button>
  </div>
</nav>

<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importer" accept="application/json,.json" hidden>

<script>
(()=>{
const SEED = {"records":[],"events":[]}; /* 資料改存在 Google 試算表 */
const KEY = 'xiaopiao.v1';
const DEFAULT_FUN = ['BTS','演唱會','吉伊卡哇','動漫','扭蛋','夾娃娃','訂閱','出遊玩樂'];
/* one-character marks, like a family crest: [glyph, hue] */
const CATS = {
  '小吃':['食',28],'手搖':['茶',95],'交通':['行',205],'購物':['買',330],'社交':['友',45],'健康':['健',150],
  '旅行':['旅',190],'家':['家',15],'電話費':['話',220],'公益':['善',110],'服裝':['衣',240],'美容':['美',350],
  '禮品':['禮',0],'手續費':['費',60],'辦公':['文',210],'保險':['保',170],
  'BTS':['防',265],'演唱會':['演',285],'吉伊卡哇':['吉',335],'動漫':['漫',300],'扭蛋':['蛋',50],'夾娃娃':['夾',25],'訂閱':['訂',230],'出遊玩樂':['遊',180]
};
const INC = {'薪水':['薪',120],'退款':['退',140],'發票':['票',100],'彩票':['彩',80],'買賣':['賣',150],'其他收入':['收',130]};
const PARTS = ['門票','住宿','交通','應援','周邊','吃喝','其他'];
const HUES = [262,335,200,20,150,45];
const WD = '日一二三四五六';
const NUM = '〇一二三四五六七八九';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pdate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = pdate(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a,b) => Math.round((pdate(b) - pdate(a)) / 864e5);
const num = n => Math.round(n).toLocaleString('zh-TW');
const money = n => '$' + num(n);
const bigMoney = n => `<span class="yen">$</span>${num(n)}`;
const md = s => { const d = pdate(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const wd = s => '週' + WD[pdate(s).getDay()];
const kan = n => n <= 10 ? (n === 10 ? '十' : NUM[n]) : n < 20 ? '十' + NUM[n-10] : NUM[Math.floor(n/10)] + '十' + (n % 10 ? NUM[n % 10] : '');
const shiftMonth = (ym, n) => { const [y,m] = ym.split('-').map(Number); const d = new Date(y, m-1+n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
let TODAY = ymd(new Date());

/* ---------- storage ---------- */
function fresh(){ return {v:1, records:SEED.records.map(r=>({...r})), events:SEED.events.map(e=>({...e})), funCats:[...DEFAULT_FUN], funBudget:0, theme:'auto', custom:{}}; }
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && Array.isArray(s.records)) return Object.assign(fresh(), s); } } catch(e) {}
  return fresh();
}
let storageOK = true;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch(e) { storageOK = false; } syncChanged(); }
function migrate(s){
  /* v2: 已付變成預設。舊資料裡未來日期的紀錄原本代表「要付」，轉成明確的待付 */
  if ((s.v || 1) < 2){ s.records.forEach(r => { if (r.t === 'o' && !r.st && r.d > TODAY) r.st = 'due'; }); s.v = 2; }
  return s;
}

/* ---------- Google 試算表同步 ---------- */
const SYNC_KEY = 'sujibank.sync';
const SY = (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch(e){ return {}; } })();
let syBooted = false, syBusy = false, syAgain = false, syTimer = 0, syEdits = 0, syFailToast = false;
let syStatus = '';
const syOn = () => !!(SY.url && SY.token);
function sySave(){ try { localStorage.setItem(SYNC_KEY, JSON.stringify(SY)); } catch(e){} }
function sySet(t){ syStatus = t; const el = document.getElementById('sy-status'); if (el) el.textContent = t; }
function syncChanged(){
  if (!syBooted || !syOn()) return;
  syEdits++; SY.dirty = true; sySave();
  clearTimeout(syTimer); syTimer = setTimeout(syPush, 1200);
}
function syPayload(){ return {records:S.records, events:S.events, settings:{v:S.v, funCats:S.funCats, funBudget:S.funBudget, custom:S.custom}}; }
function syAdopt(data, rev){
  const st = data.settings || {};
  S = migrate(Object.assign(fresh(), {v:2, theme:S.theme}, st, {records:data.records || [], events:data.events || []}));
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  SY.rev = rev; SY.dirty = false; SY.last = Date.now(); sySave();
}
async function syCall(body){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 30000);
  try {
    const res = await fetch(SY.url, {method:'POST', body: JSON.stringify(Object.assign({}, body, {token:SY.token})), signal:ctl.signal});
    const j = await res.json();
    if (!j.ok && j.error === 'token') throw new Error('密碼和 Apps Script 裡的不一樣');
    return j;
  } catch(e){
    if (e.name === 'AbortError') throw new Error('連線逾時');
    if (e instanceof TypeError || e instanceof SyntaxError) throw new Error('連不到試算表，檢查網址或網路');
    throw e;
  } finally { clearTimeout(t); }
}
const syTime = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
async function syPull(opts = {}){
  if (!syOn()) return;
  if (syBusy){ return; }
  syBusy = true; sySet('同步中…');
  let thenPush = false;
  try {
    const j = await syCall({action:'get'});
    if (!j.ok) throw new Error(j.error || '讀取失敗');
    const d = j.data || {}, nRemote = (d.records || []).length, remoteEmpty = !nRemote && !(d.events || []).length;
    if (remoteEmpty && S.records.length){
      /* 試算表是空的：把這台的資料上傳 */
      SY.rev = j.rev; SY.dirty = true; sySave(); thenPush = true;
    } else if (opts.first && S.records.length && nRemote &&
               !confirm(`試算表裡已經有 ${nRemote} 筆紀錄。\n\n按「確定」：改用試算表的資料\n按「取消」：用這台的 ${S.records.length} 筆覆蓋試算表`)){
      SY.rev = j.rev; SY.dirty = true; sySave(); thenPush = true;
    } else if (SY.dirty && j.rev === SY.rev){
      thenPush = true;
    } else if (opts.first || SY.dirty || j.rev !== SY.rev){
      if (SY.dirty) toast('試算表在別處被改過，已載入最新資料');
      syAdopt(d, j.rev); render(true);
      sySet(`已同步（${syTime()}）`);
    } else {
      sySet(`已同步（${syTime()}）`);
    }
    syFailToast = false;
  } catch(e){
    sySet('同步失敗：' + e.message);
    if (!opts.quiet || !syFailToast){ toast('試算表同步失敗：' + e.message); syFailToast = true; }
  } finally {
    syBusy = false;
    if (thenPush || syAgain){ syAgain = false; syPush(); }
  }
}
async function syPush(){
  clearTimeout(syTimer);
  if (!syOn() || !SY.dirty) return;
  if (syBusy){ syAgain = true; return; }
  syBusy = true; sySet('同步中…');
  const sent = syEdits;
  try {
    const j = await syCall({action:'put', baseRev: SY.rev || 0, data: syPayload()});
    if (j.ok){
      SY.rev = j.rev; SY.last = Date.now(); if (syEdits === sent) SY.dirty = false; sySave();
      sySet(`已同步（${syTime()}）`); syFailToast = false;
    } else if (j.conflict){
      syAdopt(j.data, j.rev); render(true);
      toast('試算表在別處被改過，已改用最新資料，剛剛那筆請再確認一次');
      sySet(`已同步（${syTime()}）`);
    } else if (j.error === 'empty'){
      throw new Error('為了安全，不會用 0 筆資料清空試算表');
    } else throw new Error(j.error || '寫入失敗');
  } catch(e){
    sySet('還沒存到試算表：' + e.message + '（稍後自動重試）');
    if (!syFailToast){ toast('還沒存到試算表，稍後會自動重試'); syFailToast = true; }
    syTimer = setTimeout(syPush, 20000);
  } finally {
    syBusy = false;
    if (syAgain){ syAgain = false; if (SY.dirty) syPush(); }
  }
}
let S = migrate(load());
save();

/* ---------- model ---------- */
function cat(k, t){
  const c = (t === 'i' ? INC[k] : CATS[k]) || CATS[k] || INC[k] || (S.custom[k] && [S.custom[k].e, S.custom[k].h]) || [String(k).slice(0,1), 40];
  return {e:c[0], h:c[1]};
}
const isFun = k => S.funCats.includes(k);
const icHTML = (k, t) => `<span class="ic ${t === 'i' ? 't-inc' : isFun(k) ? 't-fun' : ''}" aria-hidden="true">${esc(cat(k, t).e)}</span>`;
/* 待付 when marked so, otherwise when the date is still ahead */
/* 預設已付；標成待付才算待付。paid > 0 表示拆成已付＋待付兩部分 */
const pending = r => r.t === 'o' && r.st === 'due';
const owed = r => pending(r) ? Math.max(0, r.a - (r.paid||0)) : 0;
const paidPart = r => pending(r) ? (r.paid||0) : r.a;
const evById = id => S.events.find(e => e.id === id);
/* 演唱會判斷：類別是演唱會、備註或活動名稱像演唱會、或 BTS 的門票 */
const GIG_RE = /演唱會|演場會|巡演|音樂會|音樂祭|音樂節|見面會|fan ?meeting|concert|tour|\blive\b/i;
const isGigRec = r => r.t === 'o' && (r.k === '演唱會' || GIG_RE.test(r.n || ''));
function isGigEvent(e){
  if (e.concert === true || e.concert === false) return e.concert;
  if (GIG_RE.test(e.name)) return true;
  return S.records.some(r => r.ev === e.id && (isGigRec(r) || (r.k === 'BTS' && r.p === '門票')));
}
function upcomingGigs(){
  const evs = S.events.filter(e => e.e >= TODAY && isGigEvent(e)).map(e => ({ev:e.id, name:e.name, s:e.s, e:e.e, total:eventTotals(e).total}));
  const rs = S.records.filter(r => !r.ev && r.d >= TODAY && isGigRec(r)).map(r => ({rec:r.id, name:r.n || '演唱會', s:r.d, e:r.d, total:r.a}));
  return [...evs, ...rs].sort((a,b) => a.s.localeCompare(b.s));
}
function sumOf(list){
  const o = {spent:0, owed:0, fun:0, inc:0, all:0};
  for (const r of list){
    if (r.t === 'i'){ o.inc += r.a; continue; }
    o.all += r.a; o.spent += paidPart(r); o.owed += owed(r);
    if (isFun(r.k)) o.fun += r.a;
  }
  return o;
}
function outCats(){ return [...new Set([...Object.keys(CATS), ...Object.keys(S.custom)])]; }
function topCats(t){
  const keys = t === 'i' ? Object.keys(INC) : outCats();
  const from = addDays(TODAY, -180), cnt = {}, all = {};
  for (const r of S.records){ if (r.t !== t) continue; all[r.k] = (all[r.k]||0) + 1; if (r.d >= from) cnt[r.k] = (cnt[r.k]||0) + 1; }
  const extra = Object.keys(all).filter(k => !keys.includes(k));
  return [...keys, ...extra].sort((a,b) => (cnt[b]||0) - (cnt[a]||0) || (all[b]||0) - (all[a]||0));
}
function eventTotals(ev){
  const recs = S.records.filter(r => r.ev === ev.id);
  const parts = {}; let total = 0, ow = 0;
  for (const r of recs){ const p = r.p || '其他'; parts[p] = (parts[p]||0) + r.a; total += r.a; ow += owed(r); }
  return {recs, parts, total, owed: ow};
}
const kDate = s => { const d = pdate(s); return `${kan(d.getMonth()+1)}月${kan(d.getDate())}日`; };
const rangeTxt = ev => ev.s === ev.e ? `${md(ev.s)} ${wd(ev.s)}` : `${md(ev.s)} – ${md(ev.e)}`;

/* ---------- ui ---------- */
const ui = {tab:'list', ym: TODAY.slice(0,7), funRange:'month', statsView:'month', statsM: TODAY.slice(0,7)};
const view = $('#view');
const ICON = {
  prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H8M12 7l-5 5 5 5"/></svg>'
};
const monthTitle = ym => `<span class="n">${Number(ym.slice(5))}</span>月`;

function rowHTML(r, opts={}){
  const c = cat(r.k, r.t);
  const subs = [];
  if (r.n) subs.push(esc(r.k));
  if (opts.showDate) subs.push(md(r.d));
  const ev = r.ev && evById(r.ev);
  if (ev && !opts.hideEv) subs.push(`<span class="evtag">${esc(ev.name)}</span>`);
  const due = pending(r);
  let amt, cls = '';
  if (r.t === 'i'){ amt = '+' + money(r.a); cls = 'inc'; }
  else if (due){ cls = 'due'; amt = money(r.a) + (r.paid ? `<small>已付 ${money(r.paid)}</small>` : ''); }
  else amt = money(r.a);
  const stamp = due ? (r.paid ? '<span class="tag part">部分待付</span>' : '<span class="tag due">待付</span>') : '';
  return `<div class="swipe"><button class="swipe-del" data-swdel="${r.id}" tabindex="-1">刪除</button><button class="row" data-edit="${r.id}">${icHTML(r.k, r.t)}<span class="row-main"><span class="row-t">${esc(r.n || r.k)}</span>${subs.length ? `<span class="row-s">${subs.join('　')}</span>` : ''}</span>${stamp}<span class="row-a ${cls}">${amt}</span></button></div>`;
}
function dayHTML(d, rs){
  const x = pdate(d), n = diffDays(TODAY, d);
  const rel = n === 0 ? '今天' : n === -1 ? '昨天' : n === 1 ? '明天' : '';
  const tot = rs.filter(r => r.t === 'o').reduce((a,r) => a + r.a, 0);
  let h = `<section class="day" id="d-${d}"><div class="day-h"><span class="day-n">${x.getDate()}</span><span class="day-w">${wd(d)}${rel ? `<b>${rel}</b>` : ''}</span><span class="day-sum">${tot ? money(tot) : ''}</span><button class="day-add" data-addon="${d}" aria-label="在 ${md(d)} 記一筆">${ICON.plus}</button></div>`;
  h += rs.length ? `<div class="card">${rs.map(r => rowHTML(r)).join('')}</div>` : `<div class="card"><button class="blank" data-addon="${d}"><span>今天還沒有紀錄</span><span>記一筆</span></button></div>`;
  return h + `</section>`;
}

function gigHTML(gs){
  const g = gs[0], n = diffDays(TODAY, g.s), on = TODAY >= g.s && TODAY <= g.e;
  const when = on ? '<b>今天</b>' : n === 1 ? '<b>明天</b>' : `<b>${n}</b>天後`;
  const date = g.e !== g.s ? `${md(g.s)}–${md(g.e)}` : `${md(g.s)} ${wd(g.s)}`;
  return `<button class="gig" ${g.ev ? `data-event="${g.ev}"` : `data-edit="${g.rec}"`} aria-label="下一場演唱會 ${esc(g.name)}"><span class="gig-l">${ICON.mic}${on ? '進行中' : '演唱會'}</span><span class="gig-n">${esc(g.name)}</span><span class="gig-d">${date}</span><span class="gig-c">${when}</span>${gs.length > 1 ? `<span class="gig-more">還有 ${gs.length - 1} 場</span>` : ''}</button>`;
}

/* ---------- 明細：today first ---------- */
function renderList(){
  const ym = ui.ym, y = ym.slice(0,4);
  const list = S.records.filter(r => r.d.startsWith(ym));
  const s = sumOf(list);
  const isNow = ym === TODAY.slice(0,7);
  let h = `<header class="bar"><div class="titlerow"><h1>${monthTitle(ym)}</h1><span class="yr">${y}</span><div class="nav">
    <button class="icon-btn" data-act="search" aria-label="搜尋">${ICON.search}</button>
    <button class="icon-btn" data-act="prev" aria-label="上個月">${ICON.prev}</button>
    <button class="icon-btn" data-act="next" aria-label="下個月">${ICON.next}</button></div></div></header>`;
  const gigs = isNow ? upcomingGigs() : [];
  h += `<section class="sum ${gigs.length ? 'has-gig' : ''}"><div><p class="sum-label">本月累積</p><p class="sum-big">${bigMoney(s.all)}</p><p class="sum-sub"><span>已付<b>${money(s.spent)}</b></span><span>待付<b>${money(s.owed)}</b></span>${s.inc ? `<span>收入<b>${money(s.inc)}</b></span>` : ''}</p></div>${gigs.length ? gigHTML(gigs) : ''}</section>`;

  const groups = {};
  list.forEach(r => { (groups[r.d] = groups[r.d] || []).push(r); });
  const rev = d => (groups[d] || []).slice().reverse();
  const past = Object.keys(groups).filter(d => d < TODAY).sort().reverse();
  const later = Object.keys(groups).filter(d => d > TODAY).sort();

  if (isNow) h += dayHTML(TODAY, rev(TODAY));
  past.forEach(d => { h += dayHTML(d, rev(d)); });
  if (later.length){
    if (isNow || past.length) h += `<div class="later"><h2 class="sec">之後</h2><span class="muted">${later.length} 天</span></div>`;
    later.forEach(d => { h += dayHTML(d, rev(d)); });
  }
  if (!isNow && !past.length && !later.length) h += `<div class="empty"><p>這個月沒有紀錄</p><button class="btn" data-act="add">記一筆</button></div>`;
  return h;
}

/* ---------- 娛樂 ---------- */
function renderFun(){
  const month = ui.funRange === 'month';
  const ym = ui.ym, y = ym.slice(0,4), m = Number(ym.slice(5));
  const pref = month ? ym : y;
  const list = S.records.filter(r => r.t === 'o' && isFun(r.k) && r.d.startsWith(pref));
  const total = list.reduce((a,r) => a + r.a, 0);
  const ow = list.reduce((a,r) => a + owed(r), 0);
  const by = {};
  list.forEach(r => { const o = by[r.k] = by[r.k] || {a:0, n:0}; o.a += r.a; o.n++; });
  const cats = Object.entries(by).sort((a,b) => b[1].a - a[1].a);

  let h = `<header class="bar"><div class="titlerow"><h1>娛樂</h1>${month ? `<span class="yr">${y}</span><div class="nav"><button class="icon-btn" data-act="prev" aria-label="上個月">${ICON.prev}</button><button class="icon-btn" data-act="next" aria-label="下個月">${ICON.next}</button></div>` : ''}</div></header>
    <div class="seg" role="group" aria-label="範圍" style="margin-bottom:14px"><button data-range="month" aria-pressed="${month}">${monthTitle(ym)}</button><button data-range="year" aria-pressed="${!month}">${y} 全年</button></div>`;
  const allOut = sumOf(S.records.filter(r => r.d.startsWith(pref))).all;
  const share = allOut ? Math.round(total / allOut * 100) : 0;
  const subs = [];
  if (ow) subs.push(`<span>待付<b>${money(ow)}</b></span>`);
  if (month){
    const prev = S.records.filter(r => r.t === 'o' && isFun(r.k) && r.d.startsWith(shiftMonth(ym,-1))).reduce((a,r) => a + r.a, 0);

  h += cats.length ? `<div class="card">` + cats.map(([k,o]) => { const c = cat(k);
      return `<button class="row" data-catq="${esc(k)}">${icHTML(k,'o')}<span class="row-main"><span class="row-t">${esc(k)}</span><span class="row-s">${o.n} 筆</span></span><span class="row-a">${money(o.a)}<span class="row-pct">${Math.round(o.a/total*100)}%</span></span></button>`; }).join('') + `</div>`
    : `<div class="empty"><p>${month ? '這個月沒有娛樂花費' : '今年沒有娛樂花費'}</p></div>`;

  const evs = S.events.filter(e => month ? (e.s.slice(0,7) <= ym && e.e.slice(0,7) >= ym) : (e.s.startsWith(y) || e.e.startsWith(y)))
    .sort((a,b) => b.s.localeCompare(a.s));
  h += `<div class="sec-row"><h2 class="sec">活動</h2><button class="link" data-act="new-event">新增活動</button></div>`;
  h += evs.length ? `<div class="tickets">${evs.map(e => ticketHTML(e)).join('')}</div>` : `<p class="hint">把門票、住宿、車費、應援物記到同一個活動，就能看到一場活動總共花了多少。</p>`;
  return h;
}
/* 票券顏色：預設色票＋自訂 */
const TK_COLORS = [['#F8DC6E','黃'],['#A8CFF4','藍'],['#C9B6F2','紫'],['#F7C3D6','粉'],['#F5B49A','珊瑚'],['#B9E3C6','薄荷'],['#E9E4D8','奶茶'],['#2B2D33','黑']];
function tkColor(e){
  if (e.col === 'y') return '#F8DC6E';
  if (e.col === 'b') return '#A8CFF4';
  if (/^#[0-9a-f]{6}$/i.test(e.col || '')) return e.col;
  return S.events.indexOf(e) % 2 ? '#A8CFF4' : '#F8DC6E';
}
function inkFor(hex){
  const [r,g,b] = [1,3,5].map(i => parseInt(hex.slice(i,i+2),16) / 255).map(c => c <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4);
  return .2126*r + .7152*g + .0722*b > .32 ? '#1F2024' : '#FFFFFF';
}
function swatchesHTML(cur){

  return `<div class="swatches">${TK_COLORS.map(([c,l]) => `<button class="sw" data-sw="${c}" style="background:${c}" aria-label="${l}" aria-pressed="${c.toLowerCase() === cur.toLowerCase()}"></button>`).join('')}<label class="sw sw-custom" aria-pressed="${!preset}" style="${preset ? '' : `background:${cur}`}" aria-label="自訂顏色"><input type="color" data-swpick value="${cur}"></label></div>`;
}

/* ---------- 統計 ---------- */
const PIE = ['#F8DC6E','#A8CFF4','#F07F55','#6FA5DE','#F2C14B','#F5B49A','#CFE4F9','#C9C7BF'];
function donutHTML(list, label, scope){
  const by = {};
  list.filter(r => r.t === 'o').forEach(r => { by[r.k] = (by[r.k]||0) + r.a; });
  const cats = Object.entries(by).sort((a,b) => b[1] - a[1]);
  if (!cats.length) return `<div class="empty"><p>${label}沒有紀錄</p></div>`;
  const total = cats.reduce((a,[,v]) => a + v, 0);
  const slices = cats.slice(0, 7).map(([k,a]) => ({k, a}));
  const rest = cats.slice(7);
  if (rest.length) slices.push({k:'其他', a: rest.reduce((x,[,a]) => x + a, 0), rest: rest.map(([k]) => k)});
  let acc = 0; const gap = slices.length > 1 ? 0.7 : 0;
  const arcs = slices.map((sl, i) => {
    const pct = sl.a / total * 100, len = Math.max(0.01, pct - gap);
    const c = `<circle cx="60" cy="60" r="44" fill="none" stroke="${PIE[i]}" stroke-width="24" pathLength="100" stroke-dasharray="${len} ${100 - len}" stroke-dashoffset="${-acc}" transform="rotate(-90 60 60)"/>`;
    acc += pct; return c;
  }).join('');
  return `<div class="pie"><svg viewBox="0 0 120 120" role="img" aria-label="${label}各類別比例">${arcs}</svg><div class="pie-c"><span class="muted">${label}</span><b>${money(total)}</b></div></div>`
    + `<div class="card">` + slices.map((sl, i) => `<button class="row" ${sl.rest ? '' : `data-catq="${esc(sl.k)}" data-catm="${scope}"`}><span class="dot" style="background:${PIE[i]}"></span><span class="row-main"><span class="row-t">${esc(sl.k)}</span>${sl.rest ? `<span class="row-s">${sl.rest.map(esc).join('、')}</span>` : ''}</span><span class="row-a">${money(sl.a)}<span class="row-pct">${Math.round(sl.a / total * 100)}%</span></span></button>`).join('') + `</div>`;
}

  if (!yearView){
    const list = S.records.filter(r => r.d.startsWith(sel));

  const max = Math.max(1, ...tot), yt = tot.reduce((a,b) => a + b, 0), used = tot.filter(Boolean).length;

  h += `<h2 class="sec">每月支出</h2><div class="bars">${months.map((mm,i) => `<button data-sm="${mm}" aria-pressed="false" aria-label="${i+1}月 ${money(tot[i])}，看這個月"><span class="b" style="height:${tot[i] / max * 100}%"></span><span class="bl">${i+1}</span></button>`).join('')}</div><p class="hint">點月份可以看那個月的類別比例。</p>`;
  h += `<h2 class="sec">類別比例</h2>` + donutHTML(ylist, `${y} 年`, y);

  if (D.t !== 'o'){ box.innerHTML = ''; return; }
  const m = D.mode;
  box.innerHTML = `<p class="field-l">付款</p><div class="pay"><div class="seg"><button data-mode="paid" aria-pressed="${m === 'paid'}">已付</button><button data-mode="due" aria-pressed="${m === 'due'}">待付</button><button data-mode="split" aria-pressed="${m === 'split'}">拆兩筆</button></div>${m === 'split' ? `<div class="split"><label>已付<input id="ad-paid" inputmode="numeric" pattern="[0-9]*" placeholder="0" value="${esc(D.paid)}"></label><span class="rest"><span class="tag due">待付</span><b id="ad-rest"></b></span></div>` : ''}</div>`;
  const pi = $('#ad-paid'); if (pi) pi.addEventListener('input', e => { D.paid = e.target.value.replace(/\D/g,''); e.target.value = D.paid; updRest(); });
  updRest();
}
function updRest(){ const el = $('#ad-rest'); if (el) el.textContent = money(Math.max(0, evalExpr(D.expr) - (parseInt(D.paid) || 0))); }
function updCats(){
  const list = topCats(D.t);
  if (!list.includes(D.k)) list.unshift(D.k);
  $('#ad-cats').innerHTML = list.map(k => { const c = cat(k, D.t); return `<button class="cat" data-cat="${esc(k)}" aria-pressed="${k === D.k}">${icHTML(k, D.t)}${esc(k)}</button>`; }).join('');
}
function updEv(){
  const box = $('#ad-ev'), hits = eventsFor(D.d);
  if (D.t !== 'o' || (!isFun(D.k) && !D.ev && !hits.length)){ box.innerHTML = ''; return; }
  const near = S.events.slice().sort((a,b) => {
    const ha = hits.includes(a) ? 0 : 1, hb = hits.includes(b) ? 0 : 1;
    return ha - hb || Math.abs(diffDays(D.d, a.s)) - Math.abs(diffDays(D.d, b.s));
  }).slice(0, 5);
  if (D.ev && !near.find(e => e.id === D.ev)){ const e = evById(D.ev); if (e) near.unshift(e); }
  let h = `<p class="field-l">算進活動</p><div class="chips"><button class="chip" data-ev="" aria-pressed="${!D.ev}">不算</button>${near.map(e => `<button class="chip" data-ev="${e.id}" aria-pressed="${D.ev === e.id}">${esc(e.name)}</button>`).join('')}<button class="chip dashed" data-act="new-event-inline">＋ 新活動</button></div>`;
  if (D.ev){
    if (!D.p) D.p = guessPart();
    h += `<p class="field-l">這筆是</p><div class="chips">${PARTS.map(p => `<button class="chip" data-part="${p}" aria-pressed="${D.p === p}">${p}</button>`).join('')}</div>`;
  }
  box.innerHTML = h;
}
function guessPart(){
  const n = D.n || '';
  if (/票|場|演唱會|世運/.test(n)) return '門票';
  if (/住宿|飯店|旅館|民宿/.test(n)) return '住宿';
  if (/車|高鐵|捷運|計程|交通|機票/.test(n)) return '交通';
  if (/應援|蝴蝶結|提袋|壓克力|包裝|膠|夾子|貼紙/.test(n)) return '應援';
  if (['小吃','手搖'].includes(D.k)) return '吃喝';
  if (D.k === '交通') return '交通';
  if (['動漫','吉伊卡哇','扭蛋'].includes(D.k)) return '周邊';
  return '其他';
}
function updAll(){ updAmt(); updSug(); updDate(); updPay(); updCats(); updEv(); }
function key(k){
  if (k === 'save') return commit();
  let x = D.expr;
  if (k === 'del') x = x.slice(0, -1);
  else if (k === '+' || k === '−'){ if (!x) return; x = /[+−]$/.test(x) ? x.slice(0,-1) + k : x + k; }
  else { const last = x.split(/[+−]/).pop(); if (last.length >= 7) return; if (last === '' && k === '00') return; if (last === '0') x = x.slice(0,-1); x += k; }
  D.expr = x; updAmt(); updRest();
}
function commit(){
  const a = evalExpr(D.expr);
  if (!(a > 0)){ const el = $('#ad-amt'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); toast('先輸入金額'); return; }
  D.n = $('#ad-note').value.trim();
  const rec = {id: D.id || ('r' + Date.now().toString(36)), d:D.d, k:D.k, n:D.n, a, t:D.t};
  if (D.t === 'o'){
    if (D.ev){ rec.ev = D.ev; rec.p = D.p || guessPart(); }
    const paid = parseInt(D.paid) || 0;
    if (D.mode === 'due') rec.st = 'due';
    if (D.mode === 'split' && paid < a){ rec.st = 'due'; if (paid > 0) rec.paid = paid; }
  }
  const before = S.records.slice(), evBefore = S.events.slice(), wasEdit = !!D.id;
  let gigNote = '';
  if (!wasEdit && rec.t === 'o' && !rec.ev && isGigRec(rec)){
    let g = S.events.find(e => e.s <= rec.d && rec.d <= e.e && isGigEvent(e));
    if (!g){ g = {id:'e' + Date.now().toString(36), name: rec.n || '演唱會', s: rec.d, e: rec.d, col: S.events.length % 2 ? 'b' : 'y', concert:true}; S.events.push(g); }
    rec.ev = g.id; rec.p = '門票';
    if (rec.d >= TODAY) gigNote = '，已放進演唱會提醒';
  }
  if (wasEdit){ const i = S.records.findIndex(x => x.id === D.id); S.records[i] = rec; }
  else S.records.push(rec);
  save();
  closeSheet();
  if (!wasEdit && ui.tab === 'list' && rec.d.slice(0,7) !== ui.ym) ui.ym = rec.d.slice(0,7);
  render(true);
  toast(`${wasEdit ? '已更新' : '已記下'}　${rec.n || rec.k} ${money(a)}${rec.st === 'due' ? (rec.paid ? '（部分待付）' : '（待付）') : ''}${gigNote}`, () => { S.records = before; S.events = evBefore; save(); render(true); });
}

    p.querySelector('#ev-save').addEventListener('click', () => {

      else closeSheet(() => { render(true); openEvent(target.id); });
    });
    const del = p.querySelector('#ev-del');

      save(); closeSheet(); render(true); toast('已刪除活動');
    });
  });
}
function reopenAdd(){
  const keep = D;
  openAdd(keep.id ? {id:keep.id} : {d:keep.d, k:keep.k, ev:keep.ev});
  Object.assign(D, keep); $('#ad-note').value = D.n || '';

/* ---------- search ---------- */

      const rs = S.records.filter(r => (!scope || r.d.startsWith(scope)) && ((r.n || '').toLowerCase().includes(v) || r.k.toLowerCase().includes(v))).sort((a,b) => b.d.localeCompare(a.d));

/* ---------- backup ---------- */
async function offerFile(filename, data){
  try {
    if (window.claude && typeof window.claude.use === 'function'){
      const dl = await window.claude.use('downloads');
      if (dl){ try { await dl.save({filename, data}); toast('已匯出'); return; } catch(e){ if (e && e.code === 'declined') return; } }
    }
  } catch(e){}
  try {
    const url = URL.createObjectURL(new Blob([data], {type: filename.endsWith('.csv') ? 'text/csv' : 'application/json'}));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('已匯出');
  } catch(e){ copyText(data); }
}
async function copyText(t){ try { await navigator.clipboard.writeText(t); toast('已複製，可以貼到備忘錄保存'); } catch(e){ toast('無法複製，請改用匯出'); } }
const backupJSON = () => JSON.stringify({app:'sujibank', ...S});
function csv(){
  const rows = [['日期','收入/支出','類別','備註','合計','付款','活動','活動項目']];
  S.records.slice().sort((a,b) => b.d.localeCompare(a.d)).forEach(r => rows.push([r.d, r.t === 'i' ? '收入' : '支出', r.k, r.n || '', r.t === 'i' ? r.a : -r.a, r.t === 'i' ? '' : pending(r) ? (r.paid ? `已付${r.paid}／待付${r.a - r.paid}` : '待付') : '已付', r.ev ? (evById(r.ev)||{}).name || '' : '', r.p || '']));
  return '\ufeff' + rows.map(r => r.map(v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g,'""')}"` : v).join(',')).join('\n');
}
$('#importer').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const s = JSON.parse(await f.text());
    if (!s || !Array.isArray(s.records)) throw 0;
    if (!confirm(`還原會把目前的 ${S.records.length} 筆紀錄換成備份裡的 ${s.records.length} 筆。要繼續嗎？`)) return;
    delete s.app; S = migrate(Object.assign(fresh(), s)); save(); applyTheme(); render(); toast('已還原備份');
  } catch(err){ toast('這個檔案不是酥雞銀行的備份'); }
});

/* ---------- toast ---------- */
let toastT;
function toast(msg, undo){
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button>復原</button>' : ''}`;
  if (undo) t.querySelector('button').onclick = () => { undo(); t.classList.remove('show'); };
  t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), undo ? 5000 : 2600);
}


/* ---------- 往左滑刪除 ---------- */
const SW_W = 88;
let swOpen = null, swEnd = 0, sw = null;
function swSet(row, x, anim){
  row.classList.toggle('drag', !anim);
  row.style.transform = x ? `translateX(${x}px)` : '';
  row.parentElement.classList.toggle('show-del', x < 0);
}
function swClose(){ if (swOpen){ swSet(swOpen, 0, true); swOpen = null; } }
document.addEventListener('touchstart', e => {
  const row = e.target.closest('.swipe > .row');
  if (swOpen && row !== swOpen && !e.target.closest('.swipe-del')) swClose();
  if (!row || e.touches.length > 1) { sw = null; return; }
  const t0 = e.touches[0];
  sw = {row, x0:t0.clientX, y0:t0.clientY, base: row === swOpen ? -SW_W : 0, dir:0, x:0};
}, {passive:true});
document.addEventListener('touchmove', e => {
  if (!sw) return;
  const t0 = e.touches[0], dx = t0.clientX - sw.x0, dy = t0.clientY - sw.y0;
  if (!sw.dir){
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    sw.dir = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
    if (sw.dir === 'v'){ sw = null; return; }
  }
  e.preventDefault();
  let x = sw.base + dx;
  if (x > 0) x = 0;
  if (x < -SW_W) x = -SW_W - (-SW_W - x) * 0.3;
  sw.x = x; swSet(sw.row, x, false);
}, {passive:false});
document.addEventListener('touchend', () => {
  if (!sw) return;
  if (sw.dir === 'h'){
    swEnd = Date.now();
    if (sw.x < -SW_W / 2){ swSet(sw.row, -SW_W, true); swOpen = sw.row; }
    else { swSet(sw.row, 0, true); if (swOpen === sw.row) swOpen = null; }
  }
  sw = null;
});
document.addEventListener('touchcancel', () => { if (sw && sw.dir === 'h') swSet(sw.row, 0, true); sw = null; });
function swDelete(id, btn){
  const r = S.records.find(x => x.id === id); if (!r) return;
  const before = S.records.slice(), box = btn.closest('.swipe');
  swOpen = null;
  box.style.maxHeight = box.offsetHeight + 'px'; box.offsetHeight; box.classList.add('gone');
  setTimeout(() => {
    S.records = S.records.filter(x => x.id !== id); save();
    box.remove(); render(true);
    toast(`已刪除　${r.n || r.k}`, () => { S.records = before; save(); render(true); });
  }, 220);
}

/* ---------- wiring ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button,[data-close]');
  if (b && b.dataset.swdel){ e.preventDefault(); return swDelete(b.dataset.swdel, b); }
  if (Date.now() - swEnd < 400){ e.preventDefault(); e.stopPropagation(); return; }
  if (swOpen){ swClose(); if (b && b.closest('.swipe')){ e.preventDefault(); return; } }
  if (!b) return;
  const d = b.dataset;
  if ('close' in d) return closeSheet();
  if (d.tab){ ui.tab = d.tab; if (d.tab === 'list') ui.ym = ui.ym || TODAY.slice(0,7); render(); window.scrollTo(0,0); return; }
  if (d.key) return key(d.key);
  if (d.type){ D.t = d.type; D.k = topCats(D.t)[0]; if (D.t === 'i') D.ev = ''; sheet.querySelectorAll('[data-type]').forEach(x => x.setAttribute('aria-pressed', x === b)); return updAll(); }
  if (d.mode){ D.mode = d.mode; updPay(); if (D.mode === 'split'){ const pi = $('#ad-paid'); pi && pi.focus(); } return; }
  if (d.cat){ D.k = d.cat; autoEvent(); updCats(); updSug(); updEv(); return; }
  if (d.date){ D.d = d.date; autoEvent(); updDate(); updPay(); updEv(); return; }
  if (d.sug){ $('#ad-note').value = d.sug; D.n = d.sug; if (D.ev){ D.p = guessPart(); updEv(); } return; }
  if (d.ev !== undefined && b.closest('#ad-ev')){ D.ev = d.ev; D.evTouched = true; D.p = ''; return updEv(); }
  if (d.part){ D.p = d.part; return updEv(); }
  if (d.edit){ const go = () => openAdd({id:d.edit}); return sheet.hidden ? go() : closeSheet(go); }
  if (d.addon) return openAdd({d:d.addon});
  if (d.event) return openEvent(d.event);
  if (d.range){ ui.funRange = d.range; return render(true); }
  if (d.sm){ ui.statsM = d.sm; ui.statsView = 'month'; render(); window.scrollTo(0,0); return; }
  if (d.sview){ ui.statsView = d.sview; return render(true); }
  if (d.catq) return openSearch(d.catq, d.catm || (ui.tab === 'fun' ? (ui.funRange === 'month' ? ui.ym : ui.ym.slice(0,4)) : ''));
  if (d.funcat){ const k = d.funcat; S.funCats = isFun(k) ? S.funCats.filter(x => x !== k) : [...S.funCats, k]; save(); b.setAttribute('aria-pressed', isFun(k)); return; }
  if (d.themeSet){ S.theme = d.themeSet; save(); applyTheme(); return render(true); }
  switch (d.act){
    case 'add': return openAdd();
    case 'prev': ui.ym = shiftMonth(ui.ym, -1); return render();
    case 'next': ui.ym = shiftMonth(ui.ym, 1); return render();
    case 'sprev': case 'snext': { const dir = d.act === 'sprev' ? -1 : 1; ui.statsM = ui.statsView === 'year' ? `${Number(ui.statsM.slice(0,4)) + dir}${ui.statsM.slice(4)}` : shiftMonth(ui.statsM, dir); return render(true); }
    case 'search': return openSearch();
    case 'new-event': return openEventForm();
    case 'new-event-inline': D.n = $('#ad-note').value; return closeSheet(() => openEventForm('', true));
    case 'edit-event': return closeSheet(() => openEventForm(d.id));
    case 'add-to-event': { const ev = evById(d.id); const day = TODAY >= ev.s && TODAY <= ev.e ? TODAY : ev.s; return closeSheet(() => openAdd({ev:ev.id, d:day, k: ev.name.includes('BTS') ? 'BTS' : undefined})); }
    case 'del-rec': {
      const before = S.records.slice(), r = S.records.find(x => x.id === D.id);
      S.records = S.records.filter(x => x.id !== D.id); save(); closeSheet(); render(true);
      return toast(`已刪除　${r.n || r.k}`, () => { S.records = before; save(); render(true); });
    }
    case 'addcat': {
      const name = $('#newcat').value.trim();
      if (!name) return toast('請輸入類別名稱');
      if (CATS[name] || S.custom[name]) return toast('已經有這個類別');
      S.custom[name] = {e: name.slice(0,1), h: Math.floor(Math.random() * 360)}; save(); render(true); return toast(`已新增「${name}」`);
    }
    case 'export': return offerFile(`酥雞銀行備份-${TODAY}.json`, backupJSON());
    case 'export-csv': return offerFile(`酥雞銀行記帳-${TODAY}.csv`, csv());
    case 'copy': return copyText(backupJSON());
    case 'import': return $('#importer').click();
    case 'sync-connect': {
      const url = $('#sy-url').value.trim(), token = $('#sy-token').value.trim();
      if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) return toast('網址要是 https://script.google.com/macros/s/…/exec');
      if (!token) return toast('請輸入同步密碼');
      SY.url = url; SY.token = token; SY.rev = 0; SY.dirty = false; sySave(); syBooted = true;
      render(true);
      return syPull({first:true}).then(() => { if (ui.tab === 'settings') render(true); });
    }
    case 'sync-now': return SY.dirty ? syPush() : syPull({});
    case 'sync-off':
      if (confirm('中斷後，資料只會留在這個瀏覽器，不再寫入試算表。要繼續嗎？')){ if (SY.dirty) toast('注意：最後幾筆還沒存到試算表'); delete SY.url; delete SY.token; SY.rev = 0; SY.dirty = false; sySave(); sySet(''); render(true); }
      return;
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ if (SY.dirty) syPush(); return; }
  const t = ymd(new Date()); if (t !== TODAY){ TODAY = t; ui.ym = t.slice(0,7); render(); }
  if (syOn()) SY.dirty ? syPush() : syPull({quiet:true});
});
window.addEventListener('online', () => { if (SY.dirty) syPush(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });

applyTheme();
render();
syBooted = true;
if (syOn()) syPull({quiet:true});
})();
</script>
</body>
</html>
